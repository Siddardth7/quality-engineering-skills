[project]
name = "quality-engineering-skills"
version = "0.4.0"
description = "Engine-Powered Quality Engineering Skills — MCP tools + agent skills over a shared deterministic core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quality-core",
    "quality-mcp",
]

# Legacy Streamlit apps (fmea/spc/msa/controlplan/secom) were removed 2026-08 — this
# repo is skills + quality-mcp + quality-core only. Each engine is extracted from the
# source quality-platform repo into quality-core as its milestone comes up (FMEA's AP
# scorer already lives in quality_core.scoring); see ROADMAP.md.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
quality-core = { workspace = true }
quality-mcp = { workspace = true }

# The workspace root is a coordinator, not an installable package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3",
    "types-openpyxl>=3.1.5",
    "pip-audit>=2.10.0",
]

# One pytest config for the workspace: quality-core + quality-mcp + the top-level
# governance suites in tests/. `importlib` import mode keeps same-named test modules
# isolated across packages.
[tool.pytest.ini_options]
addopts = "--tb=short --import-mode=importlib"
testpaths = ["packages", "tests"]

# Coverage across the shared core and the MCP server (`uv run pytest --cov`).
# `branch = true` is mandatory: line coverage alone lets a 100%-line file hide an
# untested branch (a missing `else`). Every per-surface CI gate measures branch
# coverage because it reads this config.
[tool.coverage.run]
source = ["quality_core", "quality_mcp"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true  # print uncovered lines/branches so gaps are an actionable worklist
