# One ruff config for the workspace: quality-core + quality-mcp linted against the same bar.
target-version = "py311"
line-length = 100

extend-exclude = [".venv", "**/__pycache__"]

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — handled by formatter
]

[lint.per-file-ignores]
"**/tests/**" = ["F811"]  # allow redefinition in tests
