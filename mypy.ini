[mypy]
python_version = 3.11
ignore_missing_imports = True

# One type-checking bar for the repo: the shared deterministic core and the MCP
# server that exposes it. The legacy Streamlit apps + unified shell were removed
# 2026-08, so their packages are no longer in scope. As each engine is extracted
# into quality-core for its milestone it lands under quality_core and is checked here.
files =
    packages/quality-core/src/quality_core,
    packages/quality-mcp/src/quality_mcp

[mypy-plotly.*]
ignore_missing_imports = True
