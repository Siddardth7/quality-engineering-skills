[project]
name = "quality-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server workspace member exposing quality-core deterministic engines to AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quality-core",
    "mcp>=1.2.0,<2",
]

[project.scripts]
quality-mcp = "quality_mcp.server:main"

[tool.uv.sources]
quality-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_mcp"]
