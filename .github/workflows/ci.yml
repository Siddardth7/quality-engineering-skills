name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

# The gate only reads the repo: checkout, resolve the lock, lint, type-check, test.
# It never comments, pushes, publishes or uploads an artifact, so GITHUB_TOKEN is
# clamped to the minimum. Declared at workflow level so any job added later inherits
# least privilege by default (#203, audit A14).
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR), but never
# on the trunk — every commit on main should get a completed gate run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Job id `gate` is the status-check context (`CI / gate`) — the check the README
  # tells you to require in branch protection. Don't add a `name:` override here
  # without updating that note.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync workspace (locked deps + dev tools)
        run: uv sync --frozen

      # #202 (audit A11): the shared core is imported by every app and by the API. A UI
      # dependency creeping back into it is a packaging regression the test suite cannot
      # see (nothing imports streamlit *through* quality_core), so resolve quality-core's
      # own subtree from the lock and fail if any Streamlit-chain package is in it. The
      # `streamlit` optional extra is excluded by default, which is the point.
      - name: Core dependency contract (no UI chain in quality-core)
        run: |
          uv export --package quality-core --no-dev --no-emit-workspace --no-hashes \
            --frozen --format requirements-txt > /tmp/core-deps.txt
          if grep -E '^(streamlit|gitpython|tornado|protobuf|pyarrow|pydeck)==' /tmp/core-deps.txt; then
            echo "::error::quality-core resolves a Streamlit-chain dependency"
            exit 1
          fi

      # MCP server headless contract (#3, #17, #30, #37, #44, #79, audit A11): quality-mcp is a headless daemon
      # communicating via stdio with LLM hosts. It resolves quality-core engines directly
      # (including FMEA tools in quality_mcp.tools.fmea, SPC tools in quality_mcp.tools.spc,
      # MSA tools in quality_mcp.tools.msa, Control Plan tools in quality_mcp.tools.controlplan,
      # and RCA tools in quality_mcp.tools.rca)
      # and must never resolve Streamlit or UI-chain packages (streamlit, gitpython, tornado,
      # protobuf, pyarrow, pydeck). Resolve quality-mcp's subtree from the lock and fail if any
      # UI-chain package is present.
      - name: quality-mcp headless dependency guard (no UI chain in quality-mcp)
        run: |
          uv export --package quality-mcp --no-dev --no-emit-workspace --no-hashes \
            --frozen --format requirements-txt > /tmp/mcp-deps.txt
          if grep -E '^(streamlit|gitpython|tornado|protobuf|pyarrow|pydeck)==' /tmp/mcp-deps.txt; then
            echo "::error::quality-mcp resolves a Streamlit-chain dependency"
            exit 1
          fi

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Dependency vulnerability audit
        run: uv run pip-audit

      # Core coverage gate: the contracted quality-core surfaces — io (shared export +
      # validated ingest), schema (shared FMEA row/dataset contracts), scoring (RPN +
      # the AIAG-VDA Action Priority table), spc (control-chart + capability
      # primitives), canvas (FMEA/SPC/MSA visual canvas architectures), msa (MSA Gage
      # R&R engine), controlplan (Control Plan engine & PFMEA linkage), rca (Root Cause
      # Analysis schema & engine), ncr (Nonconformance Reporting schema), copq (Cost of Poor
      # Quality schema), and sqe (Supplier Quality Engineering schema — E1 scaffold) — must be
      # fully covered by quality-core's OWN tests. One run
      # over packages/quality-core covers all eleven; the combined --cov-fail-under=100 fails
      # if any line in any of them is uncovered. branch coverage is inherited from
      # [tool.coverage.run] branch=true in pyproject.
      - name: Core coverage gate
        run: >
          uv run pytest packages/quality-core
          --cov=quality_core.io
          --cov=quality_core.schema
          --cov=quality_core.scoring
          --cov=quality_core.spc
          --cov=quality_core.canvas
          --cov=quality_core.msa
          --cov=quality_core.controlplan
          --cov=quality_core.rca
          --cov=quality_core.ncr
          --cov=quality_core.copq
          --cov=quality_core.sqe
          --cov-report=term-missing
          --cov-fail-under=100

      # quality-mcp coverage gate: the FastMCP server, tools, and entry points in
      # packages/quality-mcp are testable surface exposing deterministic core engines
      # to LLMs. quality_mcp.tools.* (including quality_mcp.tools.fmea, quality_mcp.tools.canvas,
      # quality_mcp.tools.spc, quality_mcp.tools.msa, quality_mcp.tools.controlplan,
      # and quality_mcp.tools.rca) is in scope
      # and verified at 100% line & branch coverage under --cov=quality_mcp --cov-fail-under=100 from packages/quality-mcp.
      - name: quality-mcp coverage gate
        run: >
          uv run pytest packages/quality-mcp
          --cov=quality_mcp
          --cov-report=term-missing
          --cov-fail-under=100

      # Top-level governance suites (templates, skills conventions, milestone docs).
      # Run on their own so their same-named test modules don't collide with the
      # package suites under importlib import mode.
      - name: Governance test suites
        run: uv run pytest tests/

